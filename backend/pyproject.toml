[project]
name = "linkguessr-api"
version = "0.1.0"
description = "API LinkGuessr : fiches, recherche et plus courts chemins en mémoire"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "python-igraph>=0.11", "polars>=1.0", "httpx>=0.27"]

[tool.uv]
native-tls = true
package = false
